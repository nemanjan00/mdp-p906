; nice!nano (nRF52840, Adafruit UF2 bootloader, S140 6.1.1 present but unused).
; Feather nRF52840 build has the same flash layout (app at 0x26000).
[env:nicenano]
platform = nordicnrf52
board = adafruit_feather_nrf52840
framework = arduino
monitor_speed = 115200
build_flags = -DUSE_TINYUSB
lib_archive = no
